name: Публикация сайта

# Сайт — одна статическая страница. Классическая сборка Pages (через Jekyll)
# для этого репозитория встала в состояние errored и падала за 0 мс, поэтому
# публикуем напрямую артефактом: этот путь и раньше отрабатывал успешно.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Не отменять начатую публикацию следующим пушем — именно так мы потеряли v91
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
